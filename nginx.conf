# Nginx reverse-proxy config for Tabulator Pro
# Place this in /etc/nginx/sites-available/tabulator-pro
# Then: sudo ln -s /etc/nginx/sites-available/tabulator-pro /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;

    # Optional: redirect www, enforce HTTPS via certbot afterwards
    # listen 443 ssl http2; ssl_certificate ... ; ssl_certificate_key ...;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: cache static assets
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
    #     proxy_pass http://127.0.0.1:3000;
    #     expires 1d;
    #     add_header Cache-Control "public";
    # }

    client_max_body_size 5M;
}
